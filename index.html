<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math for 6th Graders</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
      padding: 20px;
    }

    header h1 {
      font-size: 3em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    header p {
      font-size: 1.3em;
      opacity: 0.9;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 30px;
    }

    .game-card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .game-card:hover {
      transform: translateY(-10px);
    }

    .game-card h2 {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      font-size: 1.8em;
      text-align: center;
    }

    .game-card p {
      padding: 15px 20px;
      color: #333;
      font-size: 1.1em;
      text-align: center;
      background: #f8f9fa;
    }

    .game-frame {
      width: 100%;
      height: 600px;
      border: none;
    }

    footer {
      text-align: center;
      color: white;
      margin-top: 50px;
      padding: 20px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎮 Math Games for 6th Graders 🎮</h1>
    <p>Learn math while having fun!</p>
  </header>

  <div class="container">
    <!-- Game 1: CrazyCattle3D -->
    <div class="game-card">
      <h2>Crazy Cattle 3D</h2>
      <p>A wild 3D adventure game!</p>
      <canvas id="canvas" class="game-frame" style="display: block; width: 100%; height: 600px;">
        Your browser does not support the canvas tag.
      </canvas>
      <noscript>Your browser does not support JavaScript.</noscript>
    </div>

    <!-- Game 2: Web Dashers (Division) -->
    <div class="game-card">
      <h2>🔢 Fun Division 🔢</h2>
      <p>Master division while playing an exciting dash game!</p>
      <iframe src="https://rawcdn.githack.com/web-dashers/web-dashers.github.io/refs/heads/main/index.html" class="game-frame" allowfullscreen></iframe>
    </div>
  </div>

  <footer>
    <p>Have fun learning! 🌟</p>
  </footer>

  <!-- CrazyCattle3D Game Scripts -->
  <script>
    const CDN_BASE = 'https://cdn.jsdelivr.net/gh/bubbls/cc3d-merge/';
    
    async function mergeSplitFiles(baseName, numParts) {
      try {
        const parts = [];
        for (let i = 1; i <= numParts; i++) {
          parts.push(`${CDN_BASE}${baseName}.part${i}`);
        }

        console.log(`Merging ${baseName} from ${numParts} parts...`);
        
        const responses = await Promise.all(parts.map(part => 
          fetch(part).catch(err => {
            console.error(`Failed to fetch ${part}:`, err);
            throw new Error(`Failed to load ${part}`);
          })
        ));
        
        for (let i = 0; i < responses.length; i++) {
          if (!responses[i].ok) {
            throw new Error(`Failed to load ${parts[i]}: ${responses[i].status} ${responses[i].statusText}`);
          }
        }

        const buffers = await Promise.all(responses.map(r => r.arrayBuffer()));
        const totalSize = buffers.reduce((sum, buf) => sum + buf.byteLength, 0);

        const mergedArray = new Uint8Array(totalSize);
        let offset = 0;
        for (const buffer of buffers) {
          mergedArray.set(new Uint8Array(buffer), offset);
          offset += buffer.byteLength;
        }

        console.log(`${baseName} merged successfully: ${totalSize} bytes`);
        return mergedArray.buffer;
      } catch (error) {
        console.error(`Error merging ${baseName}:`, error);
        throw error;
      }
    }

    window.mergedFiles = {
      pck: null,
      wasm: null
    };

    if (!window.originalFetch) {
      window.originalFetch = window.fetch;
    }

    window.fetch = function(url, ...args) {
      const urlStr = typeof url === 'string' ? url : url.toString();
      
      if (urlStr.includes('index.pck') && !urlStr.includes('.part')) {
        console.log('Intercepting index.pck request');
        return new Promise((resolve) => {
          const checkData = setInterval(() => {
            if (window.mergedFiles.pck) {
              clearInterval(checkData);
              resolve(new Response(window.mergedFiles.pck, {
                status: 200,
                statusText: 'OK',
                headers: {
                  'Content-Type': 'application/octet-stream',
                  'Content-Length': window.mergedFiles.pck.byteLength
                }
              }));
            }
          }, 50);
        });
      }
      
      if (urlStr.includes('index.wasm') && !urlStr.includes('.part')) {
        console.log('Intercepting index.wasm request');
        return new Promise((resolve) => {
          const checkData = setInterval(() => {
            if (window.mergedFiles.wasm) {
              clearInterval(checkData);
              resolve(new Response(window.mergedFiles.wasm, {
                status: 200,
                statusText: 'OK',
                headers: {
                  'Content-Type': 'application/wasm',
                  'Content-Length': window.mergedFiles.wasm.byteLength
                }
              }));
            }
          }, 50);
        });
      }
      
      return window.originalFetch.call(this, url, ...args);
    };

    (async function() {
      try {
        const [pckBuffer, wasmBuffer] = await Promise.all([
          mergeSplitFiles('index.pck', 3),
          mergeSplitFiles('index.wasm', 3)
        ]);
        
        window.mergedFiles.pck = pckBuffer;
        window.mergedFiles.wasm = wasmBuffer;
        
        console.log('All files merged and ready!');
      } catch (error) {
        console.error('Failed to merge files:', error);
      }
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/gh/bubbls/cc3d-merge/index.js"></script>
  <script> 
    const GODOT_CONFIG = {
      "args": [],
      "canvasResizePolicy": 2,
      "ensureCrossOriginIsolationHeaders": true,
      "executable": "index",
      "experimentalVK": false,
      "fileSizes": {
        "index.pck": 42336176,
        "index.wasm": 43699190
      },
      "focusCanvas": true,
      "gdextensionLibs": []
    };
    const GODOT_THREADS_ENABLED = false;
    const engine = new Engine(GODOT_CONFIG);

    (function() {
      const canvas = document.getElementById('canvas');
      
      let initializing = true;

      function displayFailureNotice(err) {
        console.error(err);
      }

      const missing = Engine.getMissingFeatures({
        threads: GODOT_THREADS_ENABLED,
      });

      if (missing.length === 0) {
        engine.startGame({
          'onProgress': function(current, total) {
            // Progress tracking
          },
        }).then(() => {
          initializing = false;
        }, displayFailureNotice);
      }
    }());
  </script>
</body>
</html>
